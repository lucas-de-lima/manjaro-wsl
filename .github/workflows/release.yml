name: Auto Release Factory

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 3 * * 1'

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  factory-build:
    name: Build, Tag & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Execute Build Script
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: 📦 Package Artifacts
        run: |
          echo "[CI] Zipping artifacts..."
          cd output
          zip -r ../Manjaro-WSL-Distro.zip ./*
          cd ..

      - name: 📅 Generate Calendar Version (CalVer)
        id: calver
        run: |
          DATE_TAG="v$(date +'%Y.%m.%d')"
          echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Manjaro-WSL-Distro.zip
          tag_name: ${{ steps.calver.outputs.tag }}
          name: Manjaro WSL Build ${{ steps.calver.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 🐧 Manjaro WSL - Build ${{ steps.calver.outputs.tag }}
            
            Automated build containing the latest Manjaro packages.
            
            - **Build Date:** ${{ steps.calver.outputs.tag }}
            - **Base Image:** `manjarolinux/base:latest`
            - **Source Commit:** `${{ github.sha }}`
            
            ### How to Install
            
            1. Download `Manjaro-WSL-Distro.zip` and extract the contents.
            2. In PowerShell, run (use the full path to `rootfs.tar.gz`):
               ```powershell
               wsl --import Manjaro C:\WSL\Manjaro C:\path\to\rootfs.tar.gz --version 2
               ```
               **Important:** `--version 2` is required for WSL2. The third argument is the path to the `rootfs.tar.gz` file.
            3. Start the distro:
               ```powershell
               wsl -d Manjaro
               ```
            4. Verify systemd is running:
               ```bash
               ps -p 1 -o comm=
               ```
               Expected output: `systemd`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}