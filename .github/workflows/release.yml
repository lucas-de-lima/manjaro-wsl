name: Auto Release Factory

on:
  workflow_dispatch:
  
  schedule:
    - cron: '0 3 * * 1'

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  factory-build:
    name: Build, Tag & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Execute Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 📦 Package Artifacts
        run: |
          echo "[CI] Zipping artifacts..."
          cd output
          zip -r ../Manjaro-WSL-Distro.zip ./*
          cd ..

      - name: 📅 Generate Calendar Version (CalVer)
        id: calver
        run: |
          DATE_TAG="v$(date +'%Y.%m.%d')"
          echo "tag=$DATE_TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Manjaro-WSL-Distro.zip
          tag_name: ${{ steps.calver.outputs.tag }}
          name: Manjaro WSL Build ${{ steps.calver.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ## 🐧 Manjaro WSL - Build ${{ steps.calver.outputs.tag }}
            
            Automated build containing the latest Manjaro packages.
            
            - **Build Date:** ${{ steps.calver.outputs.tag }}
            - **Base Image:** `manjarolinux/base:latest`
            - **Source Commit:** `${{ github.sha }}`
            
            ### How to Install
            1. Download `Manjaro-WSL-Distro.zip`.
            2. Extract the contents.
            3. Run the installer (or import manually via `wsl --import`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}